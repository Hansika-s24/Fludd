[project]
name = "fludd-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numba>=0.68.1",
    "numpy>=2.4.6",
    "rasterio>=1.4.4",
    "requests>=2.34.2",
    "scipy>=1.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
